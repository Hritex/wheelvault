<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8" />
  <title>WheelVault — Every car on Indian roads, decoded</title>
  <meta name="description" content="WheelVault: ex-showroom & on-road prices, EMI and down payment guidance, owner reviews, and spare parts info for every major car brand sold in India." />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo+Expanded:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <base href="/" />
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('wv-theme');
        var theme = stored || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <wv-root></wv-root>
</body>
</html>
